name: Build ROADLOG APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - ".github/workflows/build-roadlog.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Use Android SDK already installed on runner
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          if [ -z "$ANDROID_HOME" ] && [ -z "$ANDROID_SDK_ROOT" ]; then
            echo "Android SDK was not found on this runner."
            exit 1
          fi
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/roadlog/app app/src/main/assets app/src/main/res/values
          cp index.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "ROADLOG"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.roadlog.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.roadlog.app'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#078D70</item>
                  <item name="android:statusBarColor">#0C121B</item>
                  <item name="android:navigationBarColor">#0C121B</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:theme="@style/AppTheme" android:label="ROADLOG" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:configChanges="orientation|screenSize|keyboardHidden" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/roadlog/app/MainActivity.java <<'EOF'
          package com.roadlog.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.*;
          import android.content.Intent;
          import android.net.Uri;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.content.Context;
          import android.webkit.JavascriptInterface;
          import android.view.ViewGroup;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.net.URLDecoder;
          import android.util.Base64;

          public class MainActivity extends Activity {
              WebView web;
              WebView printWebView;
              ValueCallback<Uri[]> fileCallback;
              static final int FILE_CHOOSER = 41;
              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(android.graphics.Color.rgb(12,18,27));
                  getWindow().setNavigationBarColor(android.graphics.Color.rgb(12,18,27));
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setSupportMultipleWindows(true);
                  s.setJavaScriptCanOpenWindowsAutomatically(true);
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams params) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = cb;
                          try { startActivityForResult(params.createIntent(), FILE_CHOOSER); }
                          catch(Exception e) { fileCallback=null; return false; }
                          return true;
                      }
                  });
                  web.addJavascriptInterface(new Object() {
                      @JavascriptInterface public void printReport(String html) {
                          runOnUiThread(() -> {
                              try {
                                  if (printWebView != null) {
                                      ViewGroup parent=(ViewGroup)printWebView.getParent();
                                      if(parent!=null) parent.removeView(printWebView);
                                      printWebView.destroy();
                                  }
                                  printWebView=new WebView(MainActivity.this);
                                  printWebView.getSettings().setJavaScriptEnabled(false);
                                  printWebView.setWebViewClient(new WebViewClient() {
                                      @Override public void onPageFinished(WebView v,String url) {
                                          v.postDelayed(() -> {
                                              try {
                                                  PrintManager pm=(PrintManager)getSystemService(Context.PRINT_SERVICE);
                                                  pm.print("ROADLOG_Report",v.createPrintDocumentAdapter("ROADLOG_Report"),new PrintAttributes.Builder().setMediaSize(PrintAttributes.MediaSize.ISO_A4).build());
                                              } catch(Exception e) {
                                                  android.widget.Toast.makeText(MainActivity.this,"PDF print error: "+e.getMessage(),android.widget.Toast.LENGTH_LONG).show();
                                              }
                                          },700);
                                      }
                                  });
                                  printWebView.loadDataWithBaseURL("file:///android_asset/",html,"text/html","UTF-8",null);
                              } catch(Exception e) {
                                  android.widget.Toast.makeText(MainActivity.this,"PDF error: "+e.getMessage(),android.widget.Toast.LENGTH_LONG).show();
                              }
                          });
                      }
                  }, "Android");
                  web.setDownloadListener((url, ua, cd, mt, len) -> {
                      try {
                          if (url.startsWith("data:")) {
                              String[] parts=url.split(",",2);
                              String meta=parts[0], data=parts.length>1?parts[1]:"";
                              byte[] bytes=meta.contains(";base64")?Base64.decode(data,Base64.DEFAULT):URLDecoder.decode(data,"UTF-8").getBytes("UTF-8");
                              String filename=meta.contains("json")?"ROADLOG-backup.json":"ROADLOG-download";
                              File f=new File(getExternalFilesDir(null),filename);
                              try(FileOutputStream out=new FileOutputStream(f)){out.write(bytes);}
                              android.widget.Toast.makeText(this,"Saved in app files: "+filename,android.widget.Toast.LENGTH_LONG).show();
                          }
                      } catch(Exception e) { android.widget.Toast.makeText(this,"Download failed: "+e.getMessage(),android.widget.Toast.LENGTH_LONG).show(); }
                  });
                  web.setWebViewClient(new WebViewClient());
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }
              @Override protected void onActivityResult(int req,int res,Intent data) {
                  super.onActivityResult(req,res,data);
                  if(req==FILE_CHOOSER && fileCallback!=null) {
                      Uri[] result=WebChromeClient.FileChooserParams.parseResult(res,data);
                      fileCallback.onReceiveValue(result); fileCallback=null;
                  }
              }
              @Override public void onBackPressed() {
                  if(web!=null && web.canGoBack()) web.goBack(); else super.onBackPressed();
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ROADLOG-APK
          path: app/build/outputs/apk/debug/app-debug.apk
